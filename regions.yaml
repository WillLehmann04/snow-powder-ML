# ── Australia ─────────────────────────────────────────────────────────────────
# Forecast uses NWP-direct path (Open-Meteo snowfall + temp gate).
# Independent labels: resort_snapshot.py collects daily reports once live URLs
# are configured below. Until then the model has no SH training data.
thredbo:
  lat: -36.5054
  lon: 148.3009
  elevation: 2037
  region: nsw
  hemisphere: south
