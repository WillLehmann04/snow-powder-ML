# Ski resort configs for the powder forecasting ML system.
#
# snowjapan_slug : URL slug used at snowjapan.com/rest-api/skiarea/{slug}
# snowjapan_id   : numeric ID used at snowjapan.com/rest-api/skiarea/snowfall/{id}
#                  Discovered by POSTing to /rest-api/skiarea/{slug} and reading the Id field.
# lat/lon        : resort summit or primary lift station (decimal degrees)
# elevation      : metres above sea level (summit / upper station)
# region         : sub-national grouping (categorical model feature)
# hemisphere     : north | south (determines season-year logic)
# dist_coast_km  : approximate great-circle distance to the nearest ocean coastline (km)
#                  Used to derive maritime_influence = 100 / (dist + 10), a proxy for
#                  how much ocean moisture modulates snowfall frequency and intensity.

